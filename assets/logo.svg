<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Forge</title>
  <defs>
    <radialGradient id="body" cx="0.5" cy="0.68" r="0.62">
      <stop offset="0" stop-color="#FFD37A"/>
      <stop offset="0.45" stop-color="#FF9A3A"/>
      <stop offset="1" stop-color="#F0501C"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="wide" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="shape" d="M256 452 C164 452 102 392 102 312 C102 250 136 212 166 184 C180 170 184 154 182 138 C181 126 192 120 200 128 C212 142 218 162 228 168 C236 150 238 118 250 94 C258 76 264 64 272 58 C280 52 288 58 288 68 C290 102 306 128 322 144 C330 130 336 118 346 110 C354 104 364 108 362 118 C358 146 368 168 382 188 C402 218 410 260 410 312 C410 392 348 452 256 452 Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
  </defs>

  <circle cx="256" cy="290" r="230" fill="url(#halo)"/>
  <use href="#shape" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <!-- soft bottom shade -->
    <ellipse cx="256" cy="500" rx="230" ry="90" fill="#C2380F" opacity="0.4" filter="url(#wide)"/>
    <!-- glossy highlight -->
    <path d="M146 262 C150 220 176 196 200 186 C210 182 216 192 208 200 C188 218 174 240 168 268 C164 284 144 280 146 262 Z" fill="url(#shine)"/>
  </g>

  <!-- face -->
  <ellipse cx="212" cy="318" rx="17" ry="22" fill="#2B1610"/>
  <ellipse cx="300" cy="318" rx="17" ry="22" fill="#2B1610"/>
  <circle cx="218" cy="309" r="6.5" fill="#fff"/>
  <circle cx="306" cy="309" r="6.5" fill="#fff"/>
  <circle cx="207" cy="327" r="2.8" fill="#fff" opacity="0.9"/>
  <circle cx="295" cy="327" r="2.8" fill="#fff" opacity="0.9"/>
  <path d="M244 346 Q256 358 268 346" fill="none" stroke="#2B1610" stroke-width="6.5" stroke-linecap="round"/>
  <g filter="url(#blur)" fill="#FF4F6A" opacity="0.5">
    <ellipse cx="176" cy="350" rx="18" ry="10"/>
    <ellipse cx="336" cy="350" rx="18" ry="10"/>
  </g>
</svg>
